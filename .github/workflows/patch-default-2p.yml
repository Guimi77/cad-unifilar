name: Poner 2P por defecto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-default-2p.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cambiar valores por defecto a 2P
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
            ("case 'ACOMETIDA': return '4x16mm²\\n(15 m)\\nDesde contador';", "case 'ACOMETIDA': return '2x16mm²\\n(15 m)\\nDesde contador';"),
            ("case 'IGA': return '4P\\n40A';", "case 'IGA': return '2P\\n40A';"),
            ("case 'GENERAL_FILA': return '4P\\n40A';", "case 'GENERAL_FILA': return '2P\\n40A';"),
            ("case 'DIFERENCIAL': return '4P\\n40A\\n30mA\\nTipo AC';", "case 'DIFERENCIAL': return '2P\\n40A\\n30mA\\nTipo AC';"),
            ("case 'SOBRETENSION': return 'Transitorias\\n4P\\n40A';", "case 'SOBRETENSION': return 'Transitorias\\n2P\\n40A';"),
            ("const cable = lines[0] || '4x16mm²';", "const cable = lines[0] || '2x16mm²';"),
            ("{ key: 'poles', label: 'Número de polos', value: '4P', options: POLE_OPTIONS },", "{ key: 'poles', label: 'Número de polos', value: '2P', options: POLE_OPTIONS },"),
            ("{ key: 'poles', label: 'Número de polos', value: '4P', options: SURGE_POLE_OPTIONS },", "{ key: 'poles', label: 'Número de polos', value: '2P', options: SURGE_POLE_OPTIONS },"),
            ("poles: (match ? match[1] : '4') + 'P',", "poles: (match ? match[1] : '2') + 'P',"),
            ("poles: poles ? poles.toUpperCase() : '4P',", "poles: poles ? poles.toUpperCase() : '2P',"),
            ("const poles = readField('poles', '4').replace(/[^0-9]/g, '') || '4';", "const poles = readField('poles', '2').replace(/[^0-9]/g, '') || '2';"),
            ("editingElement.text = [readField('poles', '4P'), readField('amps', '40A')].join('\\n');", "editingElement.text = [readField('poles', '2P'), readField('amps', '40A')].join('\\n');"),
            ("readField('poles', '4P'),\n          readField('amps', '40A'),\n          readField('sensitivity', '30mA'),", "readField('poles', '2P'),\n          readField('amps', '40A'),\n          readField('sensitivity', '30mA'),"),
            ("const poles = readField('poles', '4P');", "const poles = readField('poles', '2P');"),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'No se encontró: {old[:100]}')
              text = text.replace(old, new)

          # Las definiciones principales con polos deben tener 2P por defecto.
          checks = [
            "case 'ACOMETIDA': return '2x16mm²",
            "case 'IGA': return '2P\\n40A'",
            "case 'GENERAL_FILA': return '2P\\n40A'",
            "case 'DIFERENCIAL': return '2P\\n40A\\n30mA\\nTipo AC'",
            "case 'SOBRETENSION': return 'Transitorias\\n2P\\n40A'",
            "value: '2P', options: SURGE_POLE_OPTIONS",
            "poles: poles ? poles.toUpperCase() : '2P'",
          ]
          for needle in checks:
              if needle not in text:
                  raise SystemExit(f'Falta comprobación: {needle}')

          path.write_text(text, encoding='utf-8')

          scripts = re.findall(r'<script>([\s\S]*?)</script>', text)
          if not scripts:
              raise SystemExit('No se encontró el script principal')
          Path('/tmp/unifilar.js').write_text(scripts[-1], encoding='utf-8')
          PY

          node --check /tmp/unifilar.js

      - name: Guardar cambio y retirar workflow temporal
        shell: bash
        run: |
          rm -f .github/workflows/patch-default-2p.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Usar 2P por defecto en protecciones"
          git push
