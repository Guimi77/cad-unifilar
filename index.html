<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD UNIFILAR REBT ACCURATE</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { display: flex; flex-direction: column; height: 100vh; background: #fff; color: #000; overflow: hidden; user-select: none; }
    
    header { height: 45px; border-bottom: 2px solid #000; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #fff; z-index: 10; }
    header h1 { font-size: 1rem; font-weight: bold; }
    .header-btns { display: flex; gap: 8px; }
    .btn-hdr { background: #000; color: #fff; border: none; padding: 6px 12px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .btn-hdr:hover { background: #333; }

    .container { display: flex; flex: 1; height: calc(100vh - 45px); }
    
    .sidebar { width: 230px; border-right: 2px solid #000; padding: 15px 10px; background: #fff; display: flex; flex-direction: column; gap: 8px; z-index: 10; overflow-y: auto; }
    .sidebar-title { font-size: 0.8rem; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 4px; }
    .btn-lib { background: #fff; border: 1px solid #000; padding: 8px 8px; text-align: left; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
    .btn-lib:hover { background: #f0f0f0; }

    /* Canvas con puntos alineados en offset 0 */
    .canvas-area { flex: 1; background: #ffffff; background-image: radial-gradient(#aaa 1.5px, transparent 1.5px); background-size: 20px 20px; background-position: 0 0; position: relative; overflow: hidden; }
    
    /* Cajetín */
    .cajetin { position: absolute; top: 20px; right: 20px; border: 2px solid #000; background: #fff; width: 220px; font-size: 0.65rem; z-index: 5; cursor: move; }
    .cajetin-head { border-bottom: 2px solid #000; text-align: center; font-weight: bold; padding: 4px; }
    .cajetin-body { padding: 6px; }
    .cajetin-val { font-weight: bold; cursor: pointer; }

    /* Nodos Draggables */
    .draggable-node { position: absolute; cursor: move; display: flex; align-items: flex-start; background: transparent; }
    .draggable-node:hover { outline: 1px dashed #ccc; }
    
    /* Símbolos y etiquetas */
    .sym-container { display: flex; align-items: center; width: 40px; height: 60px; position: relative; justify-content: center; }
    .sym-svg { width: 40px; height: 60px; display: block; overflow: visible; }
    .sym-label { font-size: 0.7rem; font-weight: bold; white-space: nowrap; cursor: pointer; background: #fff; padding: 2px 6px; position: absolute; left: 45px; top: 20px; }
    
    /* Línea Horizontal exacta */
    .line-wrapper-h { display: flex; align-items: center; position: relative; height: 20px; width: auto; }
    .line-h { height: 2px; background: #000; min-width: 20px; width: 100px; position: absolute; top: 9px; left: 0; }
    .handle-h { width: 8px; height: 8px; background: #000; cursor: ew-resize; position: absolute; right: -4px; top: 6px; z-index: 10; }

    /* Línea Vertical exacta */
    .line-wrapper-v { display: flex; flex-direction: column; align-items: center; position: relative; width: 20px; height: auto; }
    .line-v { width: 2px; background: #000; min-height: 20px; height: 100px; position: absolute; left: 9px; top: 0; }
    .handle-v { width: 8px; height: 8px; background: #000; cursor: ns-resize; position: absolute; bottom: -4px; left: 6px; z-index: 10; }

    /* Cable vertical con rotulación */
    .cable-node { display: flex; flex-direction: column; align-items: center; width: 40px; position: relative; }
    .cable-text { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 0.6rem; font-weight: bold; white-space: nowrap; background: #fff; padding: 2px; cursor: pointer; margin: 5px 0; }
    .circuit-label { border-top: 2px solid #000; font-size: 0.65rem; font-weight: bold; padding-top: 2px; text-align: center; background: #fff; cursor: pointer; width: 100px; position: absolute; top: 100%; left: -30px; }

    .del-btn { position: absolute; top: -8px; right: -8px; background: red; color: white; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; cursor: pointer; display: none; line-height: 16px; text-align: center; z-index: 20; }
    .draggable-node:hover .del-btn { display: block; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ CAD UNIFILAR - REBT ACCURATE</h1>
    <div class="header-btns">
      <button class="btn-hdr" onclick="exportarPNG()">📥 EXPORTAR PNG</button>
      <button class="btn-hdr" onclick="editarCajetin()">⚙️ CAJETÍN</button>
    </div>
  </header>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-title">CONEXIONES</div>
      <button class="btn-lib" onclick="spawn('LINEA_H')">➖ LÍNEA HORIZONTAL</button>
      <button class="btn-lib" onclick="spawn('LINEA_V')">🏽 LÍNEA VERTICAL</button>

      <div class="sidebar-title" style="margin-top:10px;">SÍMBOLOS NORMALIZADOS</div>
      <button class="btn-lib" onclick="spawn('ACOMETIDA')">➕ ACOMETIDA / CONTADOR</button>
      <button class="btn-lib" onclick="spawn('IGA')">➕ IGA / ICP (SECCIONADOR)</button>
      <button class="btn-lib" onclick="spawn('DIFERENCIAL')">➕ DIFERENCIAL (ID)</button>
      <button class="btn-lib" onclick="spawn('PIA')">➕ MAGNETOTÉRMICO (PIA)</button>
      <button class="btn-lib" onclick="spawn('CABLE')">➕ LÍNEA CABLE / CIRCUITO</button>
      <button class="btn-lib" onclick="spawn('TIERRA')">➕ TOMA DE TIERRA</button>
      <button class="btn-lib" onclick="spawn('TEXTO')">➕ NOTA / TEXTO LIBRE</button>
    </div>

    <div class="canvas-area" id="canvas">
      <div class="cajetin" id="cajetin">
        <div class="cajetin-head">CUADRO ELÉCTRICO GENERAL</div>
        <div class="cajetin-body">
          <div>TÍTULO: <span class="cajetin-val" id="cj-titulo" ondblclick="editarCajetin()">Cuadro Principal</span></div>
          <div>DIRECCIÓN: <span class="cajetin-val" id="cj-dir" ondblclick="editarCajetin()">c/ Sa Pansa 24</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeNode = null;
    let offsetX = 0, offsetY = 0;
    const GRID_SIZE = 20;

    function makeDraggable(el) {
      el.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('del-btn') || 
            e.target.classList.contains('handle-h') || 
            e.target.classList.contains('handle-v')) return;
            
        activeNode = el;
        offsetX = e.clientX - el.getBoundingClientRect().left;
        offsetY = e.clientY - el.getBoundingClientRect().top;
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function onMouseMove(e) {
      if (!activeNode) return;
      const canvas = document.getElementById('canvas');
      const rect = canvas.getBoundingClientRect();
      let x = e.clientX - rect.left - offsetX;
      let y = e.clientY - rect.top - offsetY;
      
      // Ajuste Snap a múltiplos exactos de 20px
      x = Math.round(x / GRID_SIZE) * GRID_SIZE;
      y = Math.round(y / GRID_SIZE) * GRID_SIZE;

      activeNode.style.left = x + 'px';
      activeNode.style.top = y + 'px';
    }

    function onMouseUp() {
      activeNode = null;
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }

    makeDraggable(document.getElementById('cajetin'));

    // Símbolos vectoriales perfectamente centrados en eje (20px)
    const SVGS = {
      ACOMETIDA: `<svg class="sym-svg" viewBox="0 0 40 60"><path d="M20,0 V15 M10,15 H30 V45 H10 Z M20,45 V60" stroke="#000" stroke-width="2" fill="none"/><text x="12" y="34" font-size="9" font-weight="bold">kWh</text></svg>`,
      IGA: `<svg class="sym-svg" viewBox="0 0 40 60"><path d="M20,0 V23 M20,37 V60 M20,37 L28,23" stroke="#000" stroke-width="2" fill="none"/><circle cx="20" cy="23" r="2" fill="#000"/><circle cx="20" cy="37" r="2" fill="#000"/><path d="M12,28 H24" stroke="#000" stroke-width="1.5" stroke-dasharray="2,2"/></svg>`,
      DIFERENCIAL: `<svg class="sym-svg" viewBox="0 0 40 60"><path d="M20,0 V20 M20,40 V60 M20,40 L28,23" stroke="#000" stroke-width="2" fill="none"/><circle cx="20" cy="23" r="2" fill="#000"/><circle cx="20" cy="40" r="2" fill="#000"/><rect x="7" y="21" width="12" height="20" rx="2" stroke="#000" stroke-width="1.5" fill="none"/><text x="9" y="34" font-size="7" font-weight="bold">T</text></svg>`,
      PIA: `<svg class="sym-svg" viewBox="0 0 40 60"><path d="M20,0 V23 M20,37 V60 M20,37 L28,23" stroke="#000" stroke-width="2" fill="none"/><circle cx="20" cy="23" r="2" fill="#000"/><circle cx="20" cy="37" r="2" fill="#000"/><rect x="8" y="26" width="8" height="8" stroke="#000" stroke-width="1.5" fill="none"/></svg>`,
      TIERRA: `<svg class="sym-svg" viewBox="0 0 40 40"><path d="M20,0 V20 M5,20 H35 M10,26 H30 M15,32 H25" stroke="#000" stroke-width="2" fill="none"/></svg>`
    };

    function spawn(tipo) {
      const canvas = document.getElementById('canvas');
      const node = document.createElement('div');
      node.className = 'draggable-node';
      node.style.left = '100px';
      node.style.top = '100px';

      let inner = `<button class="del-btn" onclick="this.parentElement.remove()">✕</button>`;

      if (tipo === 'LINEA_H') {
        inner += `
          <div class="line-wrapper-h">
            <div class="line-h"></div>
            <div class="handle-h"></div>
          </div>`;
      } else if (tipo === 'LINEA_V') {
        inner += `
          <div class="line-wrapper-v">
            <div class="line-v"></div>
            <div class="handle-v"></div>
          </div>`;
      } else if (tipo === 'ACOMETIDA') {
        inner += `<div class="sym-container">${SVGS.ACOMETIDA}<div class="sym-label" ondblclick="editTxt(this)">CGP / MEDIDA 230V</div></div>`;
      } else if (tipo === 'IGA') {
        inner += `<div class="sym-container">${SVGS.IGA}<div class="sym-label" ondblclick="editTxt(this)">IGA II POLOS 40A</div></div>`;
      } else if (tipo === 'DIFERENCIAL') {
        inner += `<div class="sym-container">${SVGS.DIFERENCIAL}<div class="sym-label" ondblclick="editTxt(this)">I.DIF. II POLOS 40A 30mA</div></div>`;
      } else if (tipo === 'PIA') {
        inner += `<div class="sym-container">${SVGS.PIA}<div class="sym-label" ondblclick="editTxt(this)">I.MAG. II POLOS 16A</div></div>`;
      } else if (tipo === 'TIERRA') {
        inner += `<div class="sym-container">${SVGS.TIERRA}</div>`;
      } else if (tipo === 'CABLE') {
        inner += `
          <div class="cable-node">
            <div class="line-v" style="height: 40px; position:static;"></div>
            <div class="cable-text" ondblclick="editTxt(this)">2x2.5+TTx2.5mm2Cu BAJO TUBO=20mm</div>
            <div class="circuit-label" ondblclick="editTxt(this)">C2-TOMAS DE CORRIENTE</div>
          </div>
        `;
      } else if (tipo === 'TEXTO') {
        inner += `<div class="sym-label" style="position:static" ondblclick="editTxt(this)">Texto / Nota técnica</div>`;
      }

      node.innerHTML = inner;
      canvas.appendChild(node);
      makeDraggable(node);

      if (tipo === 'LINEA_H') initResizeH(node);
      if (tipo === 'LINEA_V') initResizeV(node);
    }

    function initResizeH(node) {
      const handle = node.querySelector('.handle-h');
      const line = node.querySelector('.line-h');
      handle.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        const startX = e.clientX;
        const startW = line.offsetWidth;
        function onMove(eMove) {
          let diff = eMove.clientX - startX;
          let newWidth = Math.max(20, Math.round((startW + diff) / GRID_SIZE) * GRID_SIZE);
          line.style.width = newWidth + 'px';
          handle.style.left = newWidth + 'px';
        }
        function onStop() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onStop);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onStop);
      });
    }

    function initResizeV(node) {
      const handle = node.querySelector('.handle-v');
      const line = node.querySelector('.line-v');
      handle.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        const startY = e.clientY;
        const startH = line.offsetHeight;
        function onMove(eMove) {
          let diff = eMove.clientY - startY;
          let newHeight = Math.max(20, Math.round((startH + diff) / GRID_SIZE) * GRID_SIZE);
          line.style.height = newHeight + 'px';
          handle.style.top = (newHeight - 4) + 'px';
        }
        function onStop() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onStop);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onStop);
      });
    }

    function editTxt(el) {
      const val = prompt('Editar texto:', el.innerText.replace(/\n/g, ' '));
      if (val !== null && val.trim() !== '') el.innerText = val;
    }

    function editarCajetin() {
      const t = prompt('Título del Cuadro:', document.getElementById('cj-titulo').innerText);
      if (t !== null) document.getElementById('cj-titulo').innerText = t;
      const d = prompt('Dirección:', document.getElementById('cj-dir').innerText);
      if (d !== null) document.getElementById('cj-dir').innerText = d;
    }

    function exportarPNG() {
      document.querySelectorAll('.del-btn, .handle-h, .handle-v').forEach(b => b.style.display = 'none');
      html2canvas(document.getElementById('canvas'), { backgroundColor: '#ffffff' }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'esquema-unifilar.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        document.querySelectorAll('.del-btn, .handle-h, .handle-v').forEach(b => b.style.display = '');
      });
    }
  </script>
</body>
</html>
