<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD UNIFILAR SIMBOLOGÍA REBT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { display: flex; flex-direction: column; height: 100vh; background: #fff; color: #000; overflow: hidden; user-select: none; }
    
    header { height: 45px; border-bottom: 2px solid #000; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #fff; z-index: 10; }
    header h1 { font-size: 1rem; font-weight: bold; }
    .header-btns { display: flex; gap: 8px; }
    .btn-hdr { background: #000; color: #fff; border: none; padding: 6px 12px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .btn-hdr:hover { background: #333; }

    .container { display: flex; flex: 1; height: calc(100vh - 45px); }
    
    .sidebar { width: 230px; border-right: 2px solid #000; padding: 15px 10px; background: #fff; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
    .sidebar-title { font-size: 0.8rem; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 4px; }
    .sidebar-sub { font-size: 0.65rem; color: #555; margin-bottom: 5px; }
    .btn-lib { background: #fff; border: 1px solid #000; padding: 10px 8px; text-align: left; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
    .btn-lib:hover { background: #f0f0f0; }

    .canvas-area { flex: 1; background: #ffffff; background-image: radial-gradient(#aaa 1px, transparent 1px); background-size: 20px 20px; position: relative; overflow: hidden; }
    
    /* Cajetín */
    .cajetin { position: absolute; top: 20px; right: 20px; border: 2px solid #000; background: #fff; width: 220px; font-size: 0.65rem; z-index: 5; cursor: move; }
    .cajetin-head { border-bottom: 2px solid #000; text-align: center; font-weight: bold; padding: 4px; }
    .cajetin-body { padding: 6px; }
    .cajetin-val { font-weight: bold; cursor: pointer; }

    /* Nodo Draggable */
    .draggable-node { position: absolute; cursor: move; display: flex; align-items: center; background: transparent; padding: 2px; }
    .draggable-node:hover { outline: 1px dashed #000; }
    
    /* Contenedor de símbolo y texto a la derecha */
    .sym-container { display: flex; align-items: center; gap: 8px; }
    .sym-svg { width: 40px; height: 50px; display: flex; justify-content: center; align-items: center; }
    .sym-label { font-size: 0.7rem; font-weight: bold; white-space: nowrap; cursor: pointer; background: #fff; padding: 2px 4px; border: 1px transparent dashed; }
    .sym-label:hover { border-color: #999; }

    /* Texto vertical para cables */
    .cable-node { display: flex; flex-direction: column; align-items: center; }
    .cable-text { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 0.6rem; font-weight: bold; white-space: nowrap; background: #fff; padding: 2px; cursor: pointer; }
    .circuit-label { border-top: 2px solid #000; font-size: 0.65rem; font-weight: bold; padding-top: 2px; text-align: center; background: #fff; cursor: pointer; }

    .del-btn { position: absolute; top: -8px; right: -8px; background: red; color: white; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; cursor: pointer; display: none; line-height: 16px; text-align: center; z-index: 20; }
    .draggable-node:hover .del-btn { display: block; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ CAD UNIFILAR - SIMBOLOGÍA REBT</h1>
    <div class="header-btns">
      <button class="btn-hdr" onclick="exportarPNG()">📥 EXPORTAR PNG</button>
      <button class="btn-hdr" onclick="editarCajetin()">⚙️ CAJETÍN</button>
    </div>
  </header>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-title">SÍMBOLOS NORMALIZADOS</div>
      <div class="sidebar-sub">Texto anclado a la derecha del símbolo</div>
      <button class="btn-lib" onclick="spawn('ACOMETIDA')">➕ ACOMETIDA / CONTADOR</button>
      <button class="btn-lib" onclick="spawn('IGA')">➕ IGA / ICP (SECCIONADOR)</button>
      <button class="btn-lib" onclick="spawn('DIFERENCIAL')">➕ DIFERENCIAL (ID)</button>
      <button class="btn-lib" onclick="spawn('PIA')">➕ MAGNETOTÉRMICO (PIA)</button>
      <button class="btn-lib" onclick="spawn('CABLE')">➕ LÍNEA CABLE / CIRCUITO</button>
      <button class="btn-lib" onclick="spawn('TEXTO')">➕ NOTA / TEXTO LIBRE</button>
    </div>

    <div class="canvas-area" id="canvas">
      <!-- Cajetín Móbible -->
      <div class="cajetin" id="cajetin">
        <div class="cajetin-head">CUADRO ELÉCTRICO GENERAL</div>
        <div class="cajetin-body">
          <div>TÍTULO: <span class="cajetin-val" id="cj-titulo" onclick="editarCajetin()">Cuadro Principal</span></div>
          <div>DIRECCIÓN: <span class="cajetin-val" id="cj-dir" onclick="editarCajetin()">c/ Sa Pansa 24</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeNode = null;
    let offsetX = 0, offsetY = 0;

    function makeDraggable(el) {
      el.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('del-btn') || e.target.tagName === 'SPAN') return;
        activeNode = el;
        offsetX = e.clientX - el.getBoundingClientRect().left;
        offsetY = e.clientY - el.getBoundingClientRect().top;
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function onMouseMove(e) {
      if (!activeNode) return;
      const canvas = document.getElementById('canvas');
      const rect = canvas.getBoundingClientRect();
      let x = e.clientX - rect.left - offsetX;
      let y = e.clientY - rect.top - offsetY;
      
      x = Math.round(x / 10) * 10;
      y = Math.round(y / 10) * 10;

      activeNode.style.left = x + 'px';
      activeNode.style.top = y + 'px';
    }

    function onMouseUp() {
      activeNode = null;
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }

    makeDraggable(document.getElementById('cajetin'));

    // Símbolos en formato SVG vectorial normalizado
    const SVGS = {
      ACOMETIDA: `<svg class="sym-svg" viewBox="0 0 40 50"><path d="M20,0 V15 M10,15 H30 V35 H10 Z M20,35 V50" stroke="#000" stroke-width="2" fill="none"/><text x="14" y="28" font-size="10" font-weight="bold">kWh</text></svg>`,
      IGA: `<svg class="sym-svg" viewBox="0 0 40 50"><path d="M20,0 V18 M20,32 V50 M20,32 L28,18" stroke="#000" stroke-width="2" fill="none"/><circle cx="20" cy="18" r="2" fill="#000"/><circle cx="20" cy="32" r="2" fill="#000"/><path d="M12,22 H24" stroke="#000" stroke-width="1.5" stroke-dasharray="2,2"/></svg>`,
      DIFERENCIAL: `<svg class="sym-svg" viewBox="0 0 40 50"><path d="M20,0 V15 M20,35 V50 M20,35 L28,20" stroke="#000" stroke-width="2" fill="none"/><circle cx="20" cy="20" r="2" fill="#000"/><circle cx="20" cy="35" r="2" fill="#000"/><rect x="8" y="16" width="12" height="18" rx="2" stroke="#000" stroke-width="1.5" fill="none"/><text x="10" y="28" font-size="7" font-weight="bold">T</text></svg>`,
      PIA: `<svg class="sym-svg" viewBox="0 0 40 50"><path d="M20,0 V18 M20,32 V50 M20,32 L28,18" stroke="#000" stroke-width="2" fill="none"/><circle cx="20" cy="18" r="2" fill="#000"/><circle cx="20" cy="32" r="2" fill="#000"/><rect x="8" y="21" width="8" height="8" stroke="#000" stroke-width="1.5" fill="none"/></svg>`
    };

    function spawn(tipo) {
      const canvas = document.getElementById('canvas');
      const node = document.createElement('div');
      node.className = 'draggable-node';
      node.style.left = '100px';
      node.style.top = '100px';

      let inner = `<button class="del-btn" onclick="this.parentElement.remove()">✕</button>`;

      if (tipo === 'ACOMETIDA') {
        inner += `<div class="sym-container">${SVGS.ACOMETIDA}<div class="sym-label" onclick="editTxt(this)">CGP / MEDIDA 230V</div></div>`;
      } else if (tipo === 'IGA') {
        inner += `<div class="sym-container">${SVGS.IGA}<div class="sym-label" onclick="editTxt(this)">IGA II POLOS 40A</div></div>`;
      } else if (tipo === 'DIFERENCIAL') {
        inner += `<div class="sym-container">${SVGS.DIFERENCIAL}<div class="sym-label" onclick="editTxt(this)">I.DIF. II POLOS 40A 30mA</div></div>`;
      } else if (tipo === 'PIA') {
        inner += `<div class="sym-container">${SVGS.PIA}<div class="sym-label" onclick="editTxt(this)">I.MAG. II POLOS 16A</div></div>`;
      } else if (tipo === 'CABLE') {
        inner += `
          <div class="cable-node">
            <div class="cable-text" onclick="editTxt(this)">2x2.5+TTx2.5mm2Cu BAJO TUBO=20mm</div>
            <div class="circuit-label" onclick="editTxt(this)">C2-TOMAS DE CORRIENTE</div>
          </div>
        `;
      } else if (tipo === 'TEXTO') {
        inner += `<div class="sym-label" onclick="editTxt(this)">Texto / Nota técnica</div>`;
      }

      node.innerHTML = inner;
      canvas.appendChild(node);
      makeDraggable(node);
    }

    function editTxt(el) {
      const val = prompt('Editar texto del elemento:', el.innerText.replace(/\n/g, ' '));
      if (val !== null && val.trim() !== '') el.innerText = val;
    }

    function editarCajetin() {
      const t = prompt('Título del Cuadro:', document.getElementById('cj-titulo').innerText);
      if (t !== null) document.getElementById('cj-titulo').innerText = t;
      const d = prompt('Dirección:', document.getElementById('cj-dir').innerText);
      if (d !== null) document.getElementById('cj-dir').innerText = d;
    }

    function exportarPNG() {
      document.querySelectorAll('.del-btn').forEach(b => b.style.display = 'none');
      html2canvas(document.getElementById('canvas'), { backgroundColor: '#ffffff' }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'esquema-unifilar-cad.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        document.querySelectorAll('.del-btn').forEach(b => b.style.display = '');
      });
    }
  </script>
</body>
</html>
