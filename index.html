<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD UNIFILAR REBT NATIVO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { display: flex; flex-direction: column; height: 100vh; background: #fff; color: #000; overflow: hidden; user-select: none; }
    
    header { height: 45px; border-bottom: 2px solid #000; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #fff; z-index: 10; }
    header h1 { font-size: 1rem; font-weight: bold; }
    .header-btns { display: flex; gap: 8px; }
    .btn-hdr { background: #000; color: #fff; border: none; padding: 6px 12px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .btn-hdr:hover { background: #333; }
    .btn-del { background: #c00; }
    .btn-del:hover { background: #900; }

    .container { display: flex; flex: 1; height: calc(100vh - 45px); }
    
    .sidebar { width: 230px; border-right: 2px solid #000; padding: 15px 10px; background: #fff; display: flex; flex-direction: column; gap: 8px; z-index: 10; overflow-y: auto; }
    .sidebar-title { font-size: 0.8rem; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 4px; }
    .btn-lib { background: #fff; border: 1px solid #000; padding: 8px 8px; text-align: left; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
    .btn-lib:hover { background: #f0f0f0; }

    .canvas-container { flex: 1; position: relative; overflow: hidden; background: #fff; }
    canvas { display: block; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ CAD UNIFILAR - REBT NATIVO</h1>
    <div class="header-btns">
      <button class="btn-hdr btn-del" onclick="deleteSelected()">🗑️ ELIMINAR SELECCIÓN (SUPR)</button>
      <button class="btn-hdr" onclick="exportarPNG()">📥 EXPORTAR PNG</button>
      <button class="btn-hdr" onclick="editarCajetin()">⚙️ CAJETÍN</button>
    </div>
  </header>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-title">CONEXIONES</div>
      <button class="btn-lib" onclick="addElement('LINEA_H')">➖ LÍNEA HORIZONTAL</button>
      <button class="btn-lib" onclick="addElement('LINEA_V')">🏽 LÍNEA VERTICAL</button>

      <div class="sidebar-title" style="margin-top:10px;">SÍMBOLOS NORMALIZADOS</div>
      <button class="btn-lib" onclick="addElement('ACOMETIDA')">➕ ACOMETIDA / CONTADOR</button>
      <button class="btn-lib" onclick="addElement('IGA')">➕ IGA / ICP (SECCIONADOR)</button>
      <button class="btn-lib" onclick="addElement('DIFERENCIAL')">➕ DIFERENCIAL (ID)</button>
      <button class="btn-lib" onclick="addElement('PIA')">➕ MAGNETOTÉRMICO (PIA)</button>
      <button class="btn-lib" onclick="addElement('TIERRA')">➕ TOMA DE TIERRA</button>
      <button class="btn-lib" onclick="addElement('TEXTO')">➕ NOTA / TEXTO LIBRE</button>
    </div>

    <div class="canvas-container" id="container">
      <canvas id="cadCanvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('cadCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('container');

    const GRID = 20;
    let elements = [];
    let cajetin = {
      x: 0, y: 20, width: 220, height: 60,
      titulo: 'Cuadro Principal',
      dir: 'c/ Sa Pansa 24'
    };

    let selectedElement = null;
    let isDragging = false;
    let dragOffsetX = 0, dragOffsetY = 0;
    let isResizing = false;

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      cajetin.x = canvas.width - cajetin.width - 20;
      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    function addElement(type) {
      let elem = {
        id: Date.now(),
        type: type,
        x: 100,
        y: 100,
        w: 100,
        h: 100,
        text: getDefaultText(type)
      };
      elements.push(elem);
      selectedElement = elem;
      draw();
    }

    function getDefaultText(type) {
      switch(type) {
        case 'ACOMETIDA': return '4x16mm² (15mts)';
        case 'IGA': return 'Mag.|40A';
        case 'DIFERENCIAL': return 'Dif.|40A|30mA';
        case 'PIA': return 'Mag.|16A';
        case 'TEXTO': return 'Nota técnica';
        default: return '';
      }
    }

    function deleteSelected() {
      if (!selectedElement) return;
      elements = elements.filter(el => el !== selectedElement);
      selectedElement = null;
      draw();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (document.activeElement.tagName === 'BODY') {
          deleteSelected();
        }
      }
    });

    function draw(isExporting = false) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!isExporting) {
        ctx.fillStyle = '#bbb';
        for (let x = 0; x < canvas.width; x += GRID) {
          for (let y = 0; y < canvas.height; y += GRID) {
            ctx.fillRect(x, y, 1.5, 1.5);
          }
        }
      }

      elements.forEach(el => {
        ctx.save();
        ctx.translate(el.x, el.y);

        if (el.type === 'LINEA_H') {
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(el.w, 0);
          ctx.stroke();
          if (!isExporting) {
            ctx.fillStyle = '#000';
            ctx.fillRect(el.w - 4, -4, 8, 8);
          }
        } 
        else if (el.type === 'LINEA_V') {
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, el.h);
          ctx.stroke();
          if (!isExporting) {
            ctx.fillStyle = '#000';
            ctx.fillRect(-4, el.h - 4, 8, 8);
          }
        } 
        else if (el.type === 'ACOMETIDA') {
          drawAcometida(el, isExporting);
        }
        else if (['IGA', 'DIFERENCIAL', 'PIA', 'TIERRA'].includes(el.type)) {
          drawSymbol(el.type, el.text);
        }
        else if (el.type === 'TEXTO') {
          ctx.font = 'bold 11px "Courier New"';
          ctx.fillStyle = '#000';
          ctx.fillText(el.text, 0, 0);
        }

        if (!isExporting && selectedElement === el) {
          ctx.strokeStyle = '#00f';
          ctx.lineWidth = 1;
          ctx.setLineDash([2, 2]);
          if (el.type === 'ACOMETIDA') {
            ctx.strokeRect(-10, -25, el.w + 20, 55);
          } else {
            ctx.strokeRect(-10, -10, 40, 55);
          }
          ctx.setLineDash([]);
        }

        ctx.restore();
      });

      drawCajetin();
    }

    function drawAcometida(el, isExporting) {
      const lineY = 10;
      const match = el.text.trim().match(/^(\d+)\s*[xX×]/);
      const poles = match ? Math.max(1, Math.min(12, parseInt(match[1], 10))) : 1;

      ctx.strokeStyle = '#000';
      ctx.fillStyle = '#000';
      ctx.lineWidth = 2;

      // Línea horizontal de acometida.
      ctx.beginPath();
      ctx.moveTo(0, lineY);
      ctx.lineTo(el.w, lineY);
      ctx.stroke();

      // Una marca transversal por conductor/polo indicado al inicio: 4x... = 4.
      const spacing = 7;
      const marksWidth = (poles - 1) * spacing;
      const marksStart = Math.min(24, Math.max(10, (el.w - marksWidth) / 4));
      for (let i = 0; i < poles; i++) {
        const x = marksStart + i * spacing;
        ctx.beginPath();
        ctx.moveTo(x - 4, lineY + 7);
        ctx.lineTo(x + 4, lineY - 7);
        ctx.stroke();
      }

      // Descripción centrada sobre la línea.
      ctx.font = 'bold 10px "Courier New"';
      ctx.textAlign = 'center';
      const textWidth = ctx.measureText(el.text).width;
      ctx.fillStyle = '#fff';
      ctx.fillRect((el.w - textWidth) / 2 - 3, lineY - 20, textWidth + 6, 13);
      ctx.fillStyle = '#000';
      ctx.fillText(el.text, el.w / 2, lineY - 10);
      ctx.textAlign = 'left';

      if (!isExporting) {
        ctx.fillRect(el.w - 4, lineY - 4, 8, 8);
      }
    }

    function drawSymbol(type, text) {
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.fillStyle = '#000';

      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 15); ctx.stroke();

      if (type === 'IGA' || type === 'PIA') {
        ctx.beginPath();
        ctx.moveTo(0, 15); ctx.lineTo(8, 27);
        ctx.moveTo(0, 42); ctx.lineTo(0, 60);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 15, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 42, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0, 42); ctx.lineTo(0, 60); ctx.stroke();
      }
      else if (type === 'DIFERENCIAL') {
        // Interruptor diferencial unifilar IEC/UNE:
        // contacto de corte, toroide diferencial y circuito de prueba T.
        ctx.beginPath();
        ctx.moveTo(0, 15); ctx.lineTo(8, 27);
        ctx.moveTo(0, 42); ctx.lineTo(0, 60);
        ctx.stroke();

        ctx.beginPath(); ctx.arc(0, 15, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 42, 2, 0, Math.PI * 2); ctx.fill();

        // Toroide de detección de corriente residual.
        ctx.beginPath();
        ctx.ellipse(0, 50, 8, 4, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Circuito y pulsador de prueba.
        ctx.beginPath();
        ctx.moveTo(0, 15);
        ctx.lineTo(13, 15);
        ctx.lineTo(13, 23);
        ctx.moveTo(10, 27);
        ctx.lineTo(13, 31);
        ctx.lineTo(13, 42);
        ctx.lineTo(0, 42);
        ctx.stroke();

        ctx.font = 'bold 8px "Courier New"';
        ctx.fillText('T', 17, 28);
      }
      else if (type === 'TIERRA') {
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(0, 15);
        ctx.moveTo(-15, 15); ctx.lineTo(15, 15);
        ctx.moveTo(-10, 20); ctx.lineTo(10, 20);
        ctx.moveTo(-5, 25); ctx.lineTo(5, 25);
        ctx.stroke();
      }

      if (text && type !== 'TIERRA') {
        ctx.font = 'bold 9px "Courier New"';
        let lines = text.split('|');
        if (lines.length === 1) {
          lines = text.split(' ');
        }
        
        let maxWidth = 0;
        lines.forEach(l => {
          let m = ctx.measureText(l);
          if (m.width > maxWidth) maxWidth = m.width;
        });

        const labelX = type === 'DIFERENCIAL' ? 28 : 17;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(labelX, 20, maxWidth + 6, (lines.length * 11) + 4);

        ctx.fillStyle = '#000000';
        lines.forEach((line, index) => {
          ctx.fillText(line, labelX + 3, 31 + (index * 11));
        });
      }
    }

    function drawCajetin() {
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.fillRect(cajetin.x, cajetin.y, cajetin.width, cajetin.height);
      ctx.strokeRect(cajetin.x, cajetin.y, cajetin.width, cajetin.height);

      ctx.fillStyle = '#000';
      ctx.font = 'bold 9px "Courier New"';
      ctx.textAlign = 'center';
      ctx.fillText('CUADRO ELÉCTRICO GENERAL', cajetin.x + cajetin.width/2, cajetin.y + 14);

      ctx.beginPath();
      ctx.moveTo(cajetin.x, cajetin.y + 22);
      ctx.lineTo(cajetin.x + cajetin.width, cajetin.y + 22);
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.font = '8px "Courier New"';
      ctx.fillText('TÍTULO: ' + cajetin.titulo, cajetin.x + 6, cajetin.y + 36);
      ctx.fillText('DIRECCIÓN: ' + cajetin.dir, cajetin.x + 6, cajetin.y + 48);
    }

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (mouseX >= cajetin.x && mouseX <= cajetin.x + cajetin.width &&
          mouseY >= cajetin.y && mouseY <= cajetin.y + cajetin.height) {
        return;
      }

      selectedElement = null;
      for (let i = elements.length - 1; i >= 0; i--) {
        let el = elements[i];
        
        if ((el.type === 'LINEA_H' || el.type === 'ACOMETIDA') &&
            Math.abs(mouseX - (el.x + el.w)) < 8 &&
            Math.abs(mouseY - (el.y + (el.type === 'ACOMETIDA' ? 10 : 0))) < 8) {
          selectedElement = el;
          isResizing = true;
          return;
        }
        if (el.type === 'LINEA_V' && Math.abs(mouseX - el.x) < 8 && Math.abs(mouseY - (el.y + el.h)) < 8) {
          selectedElement = el;
          isResizing = true;
          return;
        }

        let hitBoxW = el.w || 30;
        let hitBoxH = el.h || 45;
        if (mouseX >= el.x - 10 && mouseX <= el.x + hitBoxW && mouseY >= el.y - 10 && mouseY <= el.y + hitBoxH) {
          selectedElement = el;
          isDragging = true;
          dragOffsetX = mouseX - el.x;
          dragOffsetY = mouseY - el.y;
          elements.splice(i, 1);
          elements.push(el);
          break;
        }
      }
      draw();
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!selectedElement) return;
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (isResizing) {
        if (selectedElement.type === 'LINEA_H' || selectedElement.type === 'ACOMETIDA') {
          selectedElement.w = Math.max(40, Math.round((mouseX - selectedElement.x) / GRID) * GRID);
        } else if (selectedElement.type === 'LINEA_V') {
          selectedElement.h = Math.max(20, Math.round((mouseY - selectedElement.y) / GRID) * GRID);
        }
      } else if (isDragging) {
        let rawX = mouseX - dragOffsetX;
        let rawY = mouseY - dragOffsetY;
        selectedElement.x = Math.round(rawX / GRID) * GRID;
        selectedElement.y = Math.round(rawY / GRID) * GRID;
      }
      draw();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      isResizing = false;
    });

    canvas.addEventListener('dblclick', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (mouseX >= cajetin.x && mouseX <= cajetin.x + cajetin.width &&
          mouseY >= cajetin.y && mouseY <= cajetin.y + cajetin.height) {
        editarCajetin();
        return;
      }

      elements.forEach(el => {
        let hitBoxW = el.w || 30;
        let hitBoxH = el.h || 45;
        if (mouseX >= el.x - 10 && mouseX <= el.x + hitBoxW && mouseY >= el.y - 10 && mouseY <= el.y + hitBoxH) {
          let val = prompt('Editar texto (usa | para saltos de línea):', el.text);
          if (val !== null) {
            el.text = val;
            draw();
          }
        }
      });
    });

    function editarCajetin() {
      let t = prompt('Título del Cuadro:', cajetin.titulo);
      if (t !== null) cajetin.titulo = t;
      let d = prompt('Dirección:', cajetin.dir);
      if (d !== null) cajetin.dir = d;
      draw();
    }

    function exportarPNG() {
      draw(true);

      const link = document.createElement('a');
      link.download = 'esquema-unifilar.png';
      link.href = canvas.toDataURL('image/png');
      link.click();

      draw(false);
    }

    resizeCanvas();
  </script>
</body>
</html>
