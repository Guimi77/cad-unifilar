<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD UNIFILAR REBT NATIVO</title>
  <style>
    :root {
      --ink: #14212b;
      --muted: #687782;
      --line: #d9e1e6;
      --panel: #ffffff;
      --surface: #f3f6f8;
      --brand: #087e8b;
      --brand-dark: #075d67;
      --danger: #c33f4a;
      --shadow: 0 12px 32px rgba(20, 33, 43, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--surface);
      color: var(--ink);
      overflow: hidden;
      user-select: none;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      min-height: 64px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 20px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 1px 12px rgba(20, 33, 43, 0.05);
      z-index: 10;
    }

    .brand { display: flex; align-items: center; gap: 11px; min-width: 210px; }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #0c9cac, var(--brand-dark));
      box-shadow: 0 7px 18px rgba(8, 126, 139, 0.25);
      font-size: 18px;
    }
    .brand-copy { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-copy h1 { font-size: 0.98rem; font-weight: 750; letter-spacing: -0.02em; }
    .brand-copy span { margin-top: 4px; color: var(--muted); font-size: 0.68rem; font-weight: 550; }

    .header-btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn-hdr {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 0 12px;
      color: var(--ink);
      background: #fff;
      font: 700 0.7rem/1 Inter, ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }
    .btn-hdr:hover {
      border-color: #a9bac3;
      background: #f9fbfc;
      box-shadow: 0 5px 14px rgba(20, 33, 43, 0.08);
      transform: translateY(-1px);
    }
    .btn-hdr:active { transform: translateY(0); box-shadow: none; }
    .btn-primary { color: #fff; border-color: var(--brand); background: var(--brand); }
    .btn-primary:hover { color: #fff; border-color: var(--brand-dark); background: var(--brand-dark); }
    .btn-del { color: var(--danger); border-color: #efcdd1; background: #fff8f8; }
    .btn-del:hover { color: #fff; border-color: var(--danger); background: var(--danger); }

    .container { display: flex; flex: 1; min-height: 0; }

    .sidebar {
      width: 260px;
      border-right: 1px solid var(--line);
      padding: 18px 14px;
      background: #fbfcfd;
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 5;
      overflow-y: auto;
      box-shadow: 8px 0 24px rgba(20, 33, 43, 0.035);
    }

    .sidebar-heading { padding: 2px 5px 12px; }
    .sidebar-heading strong { display: block; font-size: 0.85rem; letter-spacing: -0.01em; }
    .sidebar-heading span { display: block; margin-top: 4px; color: var(--muted); font-size: 0.69rem; line-height: 1.35; }
    .sidebar-title {
      margin: 10px 5px 2px;
      color: #80909a;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .btn-lib {
      position: relative;
      width: 100%;
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0 12px 0 38px;
      color: #33434d;
      background: transparent;
      text-align: left;
      font: 650 0.72rem/1.2 Inter, ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease, transform 140ms ease;
    }
    .btn-lib::before {
      content: "+";
      position: absolute;
      left: 11px;
      top: 50%;
      width: 18px;
      height: 18px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: var(--brand);
      background: #e4f4f5;
      transform: translateY(-50%);
      font-size: 14px;
      font-weight: 800;
    }
    .btn-lib:hover {
      color: var(--brand-dark);
      border-color: #cce4e7;
      background: #f0f9fa;
      transform: translateX(2px);
    }

    .canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #edf2f4;
    }
    canvas { display: block; background: #fff; }

    @media (max-width: 900px) {
      header { padding: 8px 12px; align-items: flex-start; }
      .brand-copy span { display: none; }
      .header-btns { gap: 5px; }
      .btn-hdr { min-height: 32px; padding: 0 8px; font-size: 0.62rem; }
      .sidebar { width: 210px; padding-inline: 9px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-mark">⚡</div>
      <div class="brand-copy">
        <h1>CAD Unifilar</h1>
        <span>Diseño eléctrico · Validación REBT</span>
      </div>
    </div>
    <div class="header-btns">
      <button class="btn-hdr btn-primary" onclick="validarREBT()">Validar REBT</button>
      <button class="btn-hdr" onclick="exportarPNG()">Exportar PNG</button>
      <button class="btn-hdr" onclick="editarCajetin()">Editar cajetín</button>
      <button class="btn-hdr btn-del" onclick="deleteSelected()">Eliminar</button>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-heading">
        <strong>Biblioteca</strong>
        <span>Añade conexiones y protecciones al esquema.</span>
      </div>

      <div class="sidebar-title">Conexiones</div>
      <button class="btn-lib" onclick="addElement('LINEA_H')">Línea horizontal</button>
      <button class="btn-lib" onclick="addElement('LINEA_V')">Línea vertical</button>

      <div class="sidebar-title">Símbolos normalizados</div>
      <button class="btn-lib" onclick="addElement('ACOMETIDA')">Acometida</button>
      <button class="btn-lib" onclick="addElement('IGA')">IGA / ICP</button>
      <button class="btn-lib" onclick="addElement('DIFERENCIAL')">Diferencial (ID)</button>
      <button class="btn-lib" onclick="addElement('PIA')">Magnetotérmico (PIA)</button>
      <button class="btn-lib" onclick="addElement('TIERRA')">Toma de tierra</button>
      <button class="btn-lib" onclick="addElement('TEXTO')">Nota de texto</button>
    </aside>

    <div class="canvas-container" id="container">
      <canvas id="cadCanvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('cadCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('container');

    const GRID = 20;
    const RENDER_SCALE = Math.max(2, window.devicePixelRatio || 1);
    let viewWidth = 0;
    let viewHeight = 0;
    let elements = [];
    let cajetin = {
      x: 0, y: 20, width: 220, height: 60,
      titulo: 'Cuadro Principal',
      dir: 'c/ Sa Pansa 24'
    };

    let selectedElement = null;
    let isDragging = false;
    let dragOffsetX = 0, dragOffsetY = 0;
    let isResizing = false;

    function resizeCanvas() {
      viewWidth = container.clientWidth;
      viewHeight = container.clientHeight;

      // El tamaño CSS conserva las coordenadas de trabajo; el bitmap interno
      // se renderiza a mayor escala para obtener texto y líneas nítidos.
      canvas.style.width = viewWidth + 'px';
      canvas.style.height = viewHeight + 'px';
      canvas.width = Math.round(viewWidth * RENDER_SCALE);
      canvas.height = Math.round(viewHeight * RENDER_SCALE);
      ctx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);

      cajetin.x = viewWidth - cajetin.width - 20;
      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    const connectionRules = {
      IGA: ['ACOMETIDA'],
      DIFERENCIAL: ['IGA', 'DIFERENCIAL'],
      PIA: ['DIFERENCIAL']
    };

    function getOutputPort(el) {
      if (el.type === 'ACOMETIDA') {
        return { x: el.x + el.w / 2, y: el.y + 10 };
      }
      return { x: el.x, y: el.y + 60 };
    }

    function getInputPort(el) {
      return { x: el.x, y: el.y };
    }

    function getCompatibleParents(type) {
      const allowed = connectionRules[type] || [];
      return elements.filter(el => allowed.includes(el.type));
    }

    function findNearestCompatibleParent(el, requireUpstream = true) {
      const input = getInputPort(el);
      let best = null;
      let bestDistance = Infinity;

      getCompatibleParents(el.type).forEach(candidate => {
        if (candidate.id === el.id) return;
        const output = getOutputPort(candidate);
        if (requireUpstream && output.y >= input.y) return;
        const distance = Math.hypot(input.x - output.x, input.y - output.y);
        if (distance < bestDistance) {
          best = candidate;
          bestDistance = distance;
        }
      });

      return { parent: best, distance: bestDistance };
    }

    function getAutomaticPlacement(type) {
      if (type === 'ACOMETIDA') {
        return { x: 100, y: 80, w: 220, h: 40, parent: null };
      }

      const allowed = connectionRules[type] || [];
      const candidates = elements.filter(el => allowed.includes(el.type));
      const parent = candidates.length ? candidates[candidates.length - 1] : null;

      if (!parent) {
        const sameType = elements.filter(el => el.type === type).length;
        return { x: 120 + sameType * 80, y: 140 + sameType * 40, w: 100, h: 100, parent: null };
      }

      const output = getOutputPort(parent);
      if (type === 'PIA') {
        const siblings = elements.filter(el => el.type === 'PIA' && el.parentId === parent.id).length;
        const offset = siblings === 0 ? 0 : Math.ceil(siblings / 2) * 80 * (siblings % 2 ? 1 : -1);
        return { x: output.x + offset, y: output.y + 100, w: 100, h: 100, parent };
      }

      return { x: output.x, y: output.y + 80, w: 100, h: 100, parent };
    }

    function addElement(type) {
      const placement = getAutomaticPlacement(type);
      let elem = {
        id: Date.now() + Math.random(),
        type: type,
        x: placement.x,
        y: placement.y,
        w: placement.w,
        h: placement.h,
        parentId: placement.parent ? placement.parent.id : null,
        text: getDefaultText(type)
      };
      elements.push(elem);
      selectedElement = elem;
      draw();
    }

    function getDefaultText(type) {
      switch(type) {
        case 'ACOMETIDA': return '4x16mm² (15mts)';
        case 'IGA': return 'Mag.|40A';
        case 'DIFERENCIAL': return 'Dif.|40A|30mA';
        case 'PIA': return 'Mag.|16A';
        case 'TEXTO': return 'Nota técnica';
        default: return '';
      }
    }

    function deleteSelected() {
      if (!selectedElement) return;
      const deletedId = selectedElement.id;
      elements = elements.filter(el => el !== selectedElement);
      elements.forEach(el => {
        if (el.parentId === deletedId) el.parentId = null;
      });
      selectedElement = null;
      draw();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (document.activeElement.tagName === 'BODY') {
          deleteSelected();
        }
      }
    });

    function draw(isExporting = false) {
      ctx.clearRect(0, 0, viewWidth, viewHeight);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, viewWidth, viewHeight);

      if (!isExporting) {
        ctx.fillStyle = '#bbb';
        for (let x = 0; x < viewWidth; x += GRID) {
          for (let y = 0; y < viewHeight; y += GRID) {
            ctx.fillRect(x, y, 1.5, 1.5);
          }
        }
      }

      drawConnections();

      elements.forEach(el => {
        ctx.save();
        ctx.translate(el.x, el.y);

        if (el.type === 'LINEA_H') {
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(el.w, 0);
          ctx.stroke();
          if (!isExporting) {
            ctx.fillStyle = '#000';
            ctx.fillRect(el.w - 4, -4, 8, 8);
          }
        } 
        else if (el.type === 'LINEA_V') {
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, el.h);
          ctx.stroke();
          if (!isExporting) {
            ctx.fillStyle = '#000';
            ctx.fillRect(-4, el.h - 4, 8, 8);
          }
        } 
        else if (el.type === 'ACOMETIDA') {
          drawAcometida(el, isExporting);
        }
        else if (['IGA', 'DIFERENCIAL', 'PIA', 'TIERRA'].includes(el.type)) {
          drawSymbol(el.type, el.text);
        }
        else if (el.type === 'TEXTO') {
          ctx.font = 'bold 11px "Courier New"';
          ctx.fillStyle = '#000';
          ctx.fillText(el.text, 0, 0);
        }

        if (!isExporting && selectedElement === el) {
          ctx.strokeStyle = '#00f';
          ctx.lineWidth = 1;
          ctx.setLineDash([2, 2]);
          if (el.type === 'ACOMETIDA') {
            ctx.strokeRect(-10, -25, el.w + 20, 55);
          } else {
            ctx.strokeRect(-10, -10, 40, 55);
          }
          ctx.setLineDash([]);
        }

        ctx.restore();
      });

      drawCajetin();
    }

    function drawConnections() {
      ctx.save();
      ctx.strokeStyle = '#253944';
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      elements.forEach(child => {
        if (!child.parentId) return;
        const parent = elements.find(el => el.id === child.parentId);
        if (!parent) return;

        const from = getOutputPort(parent);
        const to = getInputPort(child);
        const middleY = from.y + (to.y - from.y) / 2;

        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(from.x, middleY);
        ctx.lineTo(to.x, middleY);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();

        ctx.fillStyle = '#253944';
        ctx.beginPath();
        ctx.arc(from.x, from.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    function drawAcometida(el, isExporting) {
      const lineY = 10;
      const match = el.text.trim().match(/^(\d+)\s*[xX×]/);
      const poles = match ? Math.max(1, Math.min(12, parseInt(match[1], 10))) : 1;

      ctx.strokeStyle = '#000';
      ctx.fillStyle = '#000';
      ctx.lineWidth = 2;

      // Línea horizontal de acometida.
      ctx.beginPath();
      ctx.moveTo(0, lineY);
      ctx.lineTo(el.w, lineY);
      ctx.stroke();

      // Una marca transversal por conductor/polo indicado al inicio: 4x... = 4.
      const spacing = 7;
      const centerX = el.w / 2;
      const firstOffset = -((poles - 1) * spacing) / 2;
      for (let i = 0; i < poles; i++) {
        const x = centerX + firstOffset + i * spacing;
        ctx.beginPath();
        ctx.moveTo(x - 4, lineY + 7);
        ctx.lineTo(x + 4, lineY - 7);
        ctx.stroke();
      }

      // Descripción centrada sobre la línea.
      ctx.font = 'bold 10px "Courier New"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillStyle = '#000';
      ctx.fillText(el.text, centerX, lineY - 9);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      if (!isExporting) {
        ctx.fillRect(el.w - 4, lineY - 4, 8, 8);
      }
    }

    function drawSymbol(type, text) {
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.fillStyle = '#000';

      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 15); ctx.stroke();

      if (type === 'IGA' || type === 'PIA') {
        ctx.beginPath();
        ctx.moveTo(0, 15); ctx.lineTo(8, 27);
        ctx.moveTo(0, 42); ctx.lineTo(0, 60);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 15, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 42, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0, 42); ctx.lineTo(0, 60); ctx.stroke();
      }
      else if (type === 'DIFERENCIAL') {
        // Interruptor diferencial unifilar IEC/UNE:
        // contacto de corte, toroide diferencial y circuito de prueba T.
        ctx.beginPath();
        ctx.moveTo(0, 15); ctx.lineTo(8, 27);
        ctx.moveTo(0, 42); ctx.lineTo(0, 60);
        ctx.stroke();

        ctx.beginPath(); ctx.arc(0, 15, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 42, 2, 0, Math.PI * 2); ctx.fill();

        // Toroide de detección de corriente residual.
        ctx.beginPath();
        ctx.ellipse(0, 50, 8, 4, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Circuito y pulsador de prueba.
        ctx.beginPath();
        ctx.moveTo(0, 15);
        ctx.lineTo(13, 15);
        ctx.lineTo(13, 23);
        ctx.moveTo(10, 27);
        ctx.lineTo(13, 31);
        ctx.lineTo(13, 42);
        ctx.lineTo(0, 42);
        ctx.stroke();

        ctx.font = 'bold 8px "Courier New"';
        ctx.fillText('T', 17, 28);
      }
      else if (type === 'TIERRA') {
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(0, 15);
        ctx.moveTo(-15, 15); ctx.lineTo(15, 15);
        ctx.moveTo(-10, 20); ctx.lineTo(10, 20);
        ctx.moveTo(-5, 25); ctx.lineTo(5, 25);
        ctx.stroke();
      }

      if (text && type !== 'TIERRA') {
        ctx.font = 'bold 9px "Courier New"';
        let lines = text.split('|');
        if (lines.length === 1) {
          lines = text.split(' ');
        }
        
        let maxWidth = 0;
        lines.forEach(l => {
          let m = ctx.measureText(l);
          if (m.width > maxWidth) maxWidth = m.width;
        });

        const labelX = type === 'DIFERENCIAL' ? 28 : 17;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(labelX, 20, maxWidth + 6, (lines.length * 11) + 4);

        ctx.fillStyle = '#000000';
        lines.forEach((line, index) => {
          ctx.fillText(line, labelX + 3, 31 + (index * 11));
        });
      }
    }

    function drawCajetin() {
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.fillRect(cajetin.x, cajetin.y, cajetin.width, cajetin.height);
      ctx.strokeRect(cajetin.x, cajetin.y, cajetin.width, cajetin.height);

      ctx.fillStyle = '#000';
      ctx.font = 'bold 9px "Courier New"';
      ctx.textAlign = 'center';
      ctx.fillText('CUADRO ELÉCTRICO GENERAL', cajetin.x + cajetin.width/2, cajetin.y + 14);

      ctx.beginPath();
      ctx.moveTo(cajetin.x, cajetin.y + 22);
      ctx.lineTo(cajetin.x + cajetin.width, cajetin.y + 22);
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.font = '8px "Courier New"';
      ctx.fillText('TÍTULO: ' + cajetin.titulo, cajetin.x + 6, cajetin.y + 36);
      ctx.fillText('DIRECCIÓN: ' + cajetin.dir, cajetin.x + 6, cajetin.y + 48);
    }

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (mouseX >= cajetin.x && mouseX <= cajetin.x + cajetin.width &&
          mouseY >= cajetin.y && mouseY <= cajetin.y + cajetin.height) {
        return;
      }

      selectedElement = null;
      for (let i = elements.length - 1; i >= 0; i--) {
        let el = elements[i];
        
        if ((el.type === 'LINEA_H' || el.type === 'ACOMETIDA') &&
            Math.abs(mouseX - (el.x + el.w)) < 8 &&
            Math.abs(mouseY - (el.y + (el.type === 'ACOMETIDA' ? 10 : 0))) < 8) {
          selectedElement = el;
          isResizing = true;
          return;
        }
        if (el.type === 'LINEA_V' && Math.abs(mouseX - el.x) < 8 && Math.abs(mouseY - (el.y + el.h)) < 8) {
          selectedElement = el;
          isResizing = true;
          return;
        }

        let hitBoxW = el.w || 30;
        let hitBoxH = el.h || 45;
        if (mouseX >= el.x - 10 && mouseX <= el.x + hitBoxW && mouseY >= el.y - 10 && mouseY <= el.y + hitBoxH) {
          selectedElement = el;
          isDragging = true;
          dragOffsetX = mouseX - el.x;
          dragOffsetY = mouseY - el.y;
          elements.splice(i, 1);
          elements.push(el);
          break;
        }
      }
      draw();
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!selectedElement) return;
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (isResizing) {
        if (selectedElement.type === 'LINEA_H' || selectedElement.type === 'ACOMETIDA') {
          selectedElement.w = Math.max(40, Math.round((mouseX - selectedElement.x) / GRID) * GRID);
        } else if (selectedElement.type === 'LINEA_V') {
          selectedElement.h = Math.max(20, Math.round((mouseY - selectedElement.y) / GRID) * GRID);
        }
      } else if (isDragging) {
        let rawX = mouseX - dragOffsetX;
        let rawY = mouseY - dragOffsetY;
        selectedElement.x = Math.round(rawX / GRID) * GRID;
        selectedElement.y = Math.round(rawY / GRID) * GRID;
      }
      draw();
    });

    window.addEventListener('mouseup', () => {
      if (isDragging && selectedElement && connectionRules[selectedElement.type]) {
        const result = findNearestCompatibleParent(selectedElement, true);
        // Solo cambia de padre al quedar razonablemente cerca de una salida compatible.
        if (result.parent && result.distance <= 240) {
          selectedElement.parentId = result.parent.id;
        } else if (!result.parent || result.distance > 320) {
          selectedElement.parentId = null;
        }
        draw();
      }
      isDragging = false;
      isResizing = false;
    });

    canvas.addEventListener('dblclick', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (mouseX >= cajetin.x && mouseX <= cajetin.x + cajetin.width &&
          mouseY >= cajetin.y && mouseY <= cajetin.y + cajetin.height) {
        editarCajetin();
        return;
      }

      elements.forEach(el => {
        let hitBoxW = el.w || 30;
        let hitBoxH = el.h || 45;
        if (mouseX >= el.x - 10 && mouseX <= el.x + hitBoxW && mouseY >= el.y - 10 && mouseY <= el.y + hitBoxH) {
          let val = prompt('Editar texto (usa | para saltos de línea):', el.text);
          if (val !== null) {
            el.text = val;
            draw();
          }
        }
      });
    });

    function parseAmperios(text) {
      const match = String(text || '').replace(',', '.').match(/(\d+(?:\.\d+)?)\s*A\b/i);
      return match ? parseFloat(match[1]) : null;
    }

    function parseMiliamperios(text) {
      const match = String(text || '').replace(',', '.').match(/(\d+(?:\.\d+)?)\s*mA\b/i);
      return match ? parseFloat(match[1]) : null;
    }

    function validarREBT() {
      const errores = [];
      const avisos = [];
      const correctos = [];

      const acometidas = elements.filter(el => el.type === 'ACOMETIDA');
      const igas = elements.filter(el => el.type === 'IGA');
      const diferenciales = elements.filter(el => el.type === 'DIFERENCIAL');
      const pias = elements.filter(el => el.type === 'PIA');

      // Regla de coherencia del documento: un esquema de suministro simple
      // debe contener una única acometida.
      if (acometidas.length === 0) {
        avisos.push('No se ha dibujado ninguna acometida.');
      } else if (acometidas.length > 1) {
        errores.push('Hay ' + acometidas.length + ' acometidas. Este esquema admite una única acometida.');
      } else {
        correctos.push('Acometida única.');
      }

      if (diferenciales.length === 0 && pias.length > 0) {
        errores.push('Hay circuitos PIA sin ningún diferencial representado.');
      }

      // En viviendas: un diferencial de 30 mA como máximo por cada cinco circuitos.
      if (pias.length > 0 && diferenciales.length > 0) {
        const minimoIDs = Math.ceil(pias.length / 5);
        if (diferenciales.length < minimoIDs) {
          errores.push(
            'Hay ' + pias.length + ' circuitos y ' + diferenciales.length +
            ' diferencial(es). ITC-BT-25 exige al menos uno por cada cinco circuitos.'
          );
        } else {
          correctos.push('Número de diferenciales suficiente para ' + pias.length + ' circuitos.');
        }
      }

      diferenciales.forEach((dif, index) => {
        const difA = parseAmperios(dif.text);
        const sensibilidad = parseMiliamperios(dif.text);
        const nombre = 'ID ' + (index + 1);

        if (sensibilidad === null) {
          avisos.push(nombre + ': no se reconoce la sensibilidad en mA.');
        } else if (sensibilidad > 30) {
          errores.push(nombre + ': sensibilidad ' + sensibilidad + ' mA; en vivienda debe ser como máximo 30 mA.');
        }

        // La protección aguas arriba se obtiene de la conexión eléctrica real.
        let parent = elements.find(el => el.id === dif.parentId);
        const visited = new Set();
        while (parent && parent.type !== 'IGA' && !visited.has(parent.id)) {
          visited.add(parent.id);
          parent = elements.find(el => el.id === parent.parentId);
        }
        const igaAguasArriba = parent && parent.type === 'IGA' ? parent : null;
        const igaA = igaAguasArriba ? parseAmperios(igaAguasArriba.text) : null;

        if (difA === null) {
          avisos.push(nombre + ': no se reconoce su intensidad nominal en A.');
        } else if (igaA !== null) {
          if (difA < igaA) {
            errores.push(nombre + ': ' + difA + ' A es inferior al IGA aguas arriba de ' + igaA + ' A.');
          } else {
            correctos.push(nombre + ' protegido por IGA de ' + igaA + ' A.');
          }
        } else {
          // Sin protección aguas arriba reconocible, se usa la suma de los PIAs
          // situados por debajo como comprobación conservadora de diseño.
          const sumaPias = pias
            .filter(pia => pia.parentId === dif.id)
            .map(pia => parseAmperios(pia.text))
            .filter(value => value !== null)
            .reduce((sum, value) => sum + value, 0);

          if (difA !== null && sumaPias > difA) {
            avisos.push(
              nombre + ': los PIAs aguas abajo suman ' + sumaPias +
              ' A y no se reconoce un IGA aguas arriba que limite la corriente a ' + difA + ' A.'
            );
          } else if (!igaAguasArriba) {
            avisos.push(nombre + ': no se reconoce un IGA aguas arriba.');
          }
        }
      });

      // Los ID en serie son admisibles únicamente con selectividad.
      const idEnCascada = diferenciales.find(dif => {
        const parent = elements.find(el => el.id === dif.parentId);
        return parent && parent.type === 'DIFERENCIAL';
      });
      if (idEnCascada) {
        avisos.push(
          'Diferenciales en cascada detectados: debe justificarse la selectividad entre ambos (ITC-BT-17).'
        );
      }

      const desconectados = elements.filter(el =>
        connectionRules[el.type] && !el.parentId
      );
      desconectados.forEach(el => {
        avisos.push(el.type + ': elemento sin alimentación aguas arriba.');
      });

      const lineas = ['VALIDACIÓN REBT', ''];
      if (errores.length) {
        lineas.push('ERRORES');
        errores.forEach(item => lineas.push('• ' + item));
        lineas.push('');
      }
      if (avisos.length) {
        lineas.push('ADVERTENCIAS');
        avisos.forEach(item => lineas.push('• ' + item));
        lineas.push('');
      }
      if (correctos.length) {
        lineas.push('COMPROBACIONES CORRECTAS');
        correctos.forEach(item => lineas.push('• ' + item));
        lineas.push('');
      }
      lineas.push('Las comprobaciones se basan en las conexiones eléctricas reales del esquema.');
      alert(lineas.join('\n'));
    }

    function editarCajetin() {
      let t = prompt('Título del Cuadro:', cajetin.titulo);
      if (t !== null) cajetin.titulo = t;
      let d = prompt('Dirección:', cajetin.dir);
      if (d !== null) cajetin.dir = d;
      draw();
    }

    function exportarPNG() {
      draw(true);

      const link = document.createElement('a');
      link.download = 'esquema-unifilar.png';
      link.href = canvas.toDataURL('image/png');
      link.click();

      draw(false);
    }

    resizeCanvas();
  </script>
</body>
</html>
