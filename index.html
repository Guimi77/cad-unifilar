<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD UNIFILAR LIBRE</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { display: flex; flex-direction: column; height: 100vh; background: #fff; color: #000; overflow: hidden; user-select: none; }
    
    header { height: 45px; border-bottom: 2px solid #000; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #fff; z-index: 10; }
    header h1 { font-size: 1rem; font-weight: bold; }
    .header-btns { display: flex; gap: 8px; }
    .btn-hdr { background: #000; color: #fff; border: none; padding: 6px 12px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .btn-hdr:hover { background: #333; }

    .container { display: flex; flex: 1; height: calc(100vh - 45px); }
    
    .sidebar { width: 230px; border-right: 2px solid #000; padding: 15px 10px; background: #fff; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
    .sidebar-title { font-size: 0.8rem; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 4px; }
    .sidebar-sub { font-size: 0.65rem; color: #555; margin-bottom: 5px; }
    .btn-lib { background: #fff; border: 1px solid #000; padding: 10px 8px; text-align: left; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
    .btn-lib:hover { background: #f0f0f0; }

    .canvas-area { flex: 1; background: #ffffff; background-image: radial-gradient(#aaa 1px, transparent 1px); background-size: 20px 20px; position: relative; overflow: hidden; }
    
    /* Cajetín */
    .cajetin { position: absolute; top: 20px; right: 20px; border: 2px solid #000; background: #fff; width: 220px; font-size: 0.65rem; z-index: 5; cursor: move; }
    .cajetin-head { border-bottom: 2px solid #000; text-align: center; font-weight: bold; padding: 4px; }
    .cajetin-body { padding: 6px; }
    .cajetin-val { font-weight: bold; cursor: pointer; }

    /* Elementos Arrastrables */
    .draggable-node { position: absolute; cursor: move; display: flex; flex-direction: column; align-items: center; background: transparent; }
    .draggable-node:hover { outline: 1px dashed #000; }
    
    .symbol-block { border: 1px solid #000; background: #fff; padding: 4px 8px; font-size: 0.7rem; font-weight: bold; text-align: center; min-width: 80px; }
    .sym-switch { position: relative; width: 20px; height: 25px; border-left: 2px solid #000; margin: 2px 0; }
    .sym-switch::after { content: ''; position: absolute; top: 8px; left: -2px; width: 10px; height: 2px; background: #000; transform: rotate(-45deg); transform-origin: left; }
    
    .cable-text { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 0.6rem; margin: 5px 0; font-weight: bold; white-space: nowrap; background: #fff; padding: 2px; }
    .circuit-label { border-top: 2px solid #000; font-size: 0.65rem; font-weight: bold; padding-top: 2px; text-align: center; background: #fff; width: 100%; }
    
    .del-btn { position: absolute; top: -8px; right: -8px; background: red; color: white; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; cursor: pointer; display: none; line-height: 16px; text-align: center; }
    .draggable-node:hover .del-btn { display: block; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ CAD UNIFILAR - LIBRE</h1>
    <div class="header-btns">
      <button class="btn-hdr" onclick="exportarPNG()">📥 EXPORTAR PNG</button>
      <button class="btn-hdr" onclick="editarCajetin()">⚙️ CAJETÍN</button>
    </div>
  </header>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-title">LIBRERÍA DE ELEMENTOS</div>
      <div class="sidebar-sub">Haz clic para añadir y arrastra por el lienzo</div>
      <button class="btn-lib" onclick="spawn('ACOMETIDA')">➕ ACOMETIDA / ICP</button>
      <button class="btn-lib" onclick="spawn('IGA')">➕ INTERRUPTOR GENERAL (IGA)</button>
      <button class="btn-lib" onclick="spawn('DIFERENCIAL')">➕ DIFERENCIAL (ID)</button>
      <button class="btn-lib" onclick="spawn('PIA')">➕ MAGNETOTÉRMICO (PIA)</button>
      <button class="btn-lib" onclick="spawn('TEXTO')">➕ TEXTO / LÍNEA DE CABLE</button>
    </div>

    <div class="canvas-area" id="canvas">
      <!-- Cajetín Móbible -->
      <div class="cajetin" id="cajetin">
        <div class="cajetin-head">CUADRO ELÉCTRICO GENERAL</div>
        <div class="cajetin-body">
          <div>TÍTULO: <span class="cajetin-val" id="cj-titulo" onclick="editarCajetin()">Cuadro Principal</span></div>
          <div>DIRECCIÓN: <span class="cajetin-val" id="cj-dir" onclick="editarCajetin()">c/ Sa Pansa 24</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeNode = null;
    let offsetX = 0, offsetY = 0;

    function makeDraggable(el) {
      el.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('del-btn') || e.target.tagName === 'SPAN') return;
        activeNode = el;
        offsetX = e.clientX - el.getBoundingClientRect().left;
        offsetY = e.clientY - el.getBoundingClientRect().top;
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function onMouseMove(e) {
      if (!activeNode) return;
      const canvas = document.getElementById('canvas');
      const rect = canvas.getBoundingClientRect();
      let x = e.clientX - rect.left - offsetX;
      let y = e.clientY - rect.top - offsetY;
      
      // Ajuste básico a rejilla de 10px
      x = Math.round(x / 10) * 10;
      y = Math.round(y / 10) * 10;

      activeNode.style.left = x + 'px';
      activeNode.style.top = y + 'px';
    }

    function onMouseUp() {
      activeNode = null;
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }

    // Inicializar arrastre del cajetín
    makeDraggable(document.getElementById('cajetin'));

    function spawn(tipo) {
      const canvas = document.getElementById('canvas');
      const node = document.createElement('div');
      node.className = 'draggable-node';
      node.style.left = '100px';
      node.style.top = '100px';

      let inner = `<button class="del-btn" onclick="this.parentElement.remove()">✕</button>`;

      if (tipo === 'ACOMETIDA') {
        inner += `
          <div class="symbol-block" onclick="editTxt(this)">ACOMETIDA 230V</div>
          <div style="width:2px; height:15px; background:#000;"></div>
          <div class="symbol-block" onclick="editTxt(this)">ICP 40A</div>
        `;
      } else if (tipo === 'IGA') {
        inner += `
          <div class="sym-switch"></div>
          <div class="symbol-block" onclick="editTxt(this)">IGA II POLOS<br>40A</div>
        `;
      } else if (tipo === 'DIFERENCIAL') {
        inner += `
          <div class="symbol-block" onclick="editTxt(this)">I.DIF. II POLOS<br>40A 30mA</div>
        `;
      } else if (tipo === 'PIA') {
        inner += `
          <div class="sym-switch"></div>
          <div class="symbol-block" onclick="editTxt(this)">PIA 16A</div>
          <div class="cable-text" onclick="editTxt(this)">2x2.5mm2 Cu - TUBO 20mm</div>
          <div class="circuit-label" onclick="editTxt(this)">C2-TOMAS</div>
        `;
      } else if (tipo === 'TEXTO') {
        inner += `
          <div class="symbol-block" onclick="editTxt(this)">Texto / Anotación</div>
        `;
      }

      node.innerHTML = inner;
      canvas.appendChild(node);
      makeDraggable(node);
    }

    function editTxt(el) {
      const val = prompt('Editar texto/parámetro CAD:', el.innerText.replace(/\n/g, ' '));
      if (val !== null && val.trim() !== '') el.innerText = val;
    }

    function editarCajetin() {
      const t = prompt('Título del Cuadro:', document.getElementById('cj-titulo').innerText);
      if (t !== null) document.getElementById('cj-titulo').innerText = t;
      const d = prompt('Dirección:', document.getElementById('cj-dir').innerText);
      if (d !== null) document.getElementById('cj-dir').innerText = d;
    }

    function exportarPNG() {
      // Ocultar botones de borrar temporalmente para la foto
      document.querySelectorAll('.del-btn').forEach(b => b.style.display = 'none');
      html2canvas(document.getElementById('canvas'), { backgroundColor: '#ffffff' }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'esquema-unifilar-libre.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        document.querySelectorAll('.del-btn').forEach(b => b.style.display = '');
      });
    }
  </script>
</body>
</html>
